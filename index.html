
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Study Hub | NFC Attendance</title>
  <meta name="theme-color" content="#123c32">
  <style>
    :root {
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: #17221e;
      background: #f4f7f5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 22px;
    }
    .card {
      width: min(100%, 460px);
      background: #fff;
      border: 1px solid #e0e8e3;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 18px 55px #173d2c12;
    }
    .brand {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .16em;
      color: #27745c;
      text-transform: uppercase;
    }
    h1 { font-size: 29px; line-height: 1.15; margin: 12px 0 8px; }
    p { color: #62716a; line-height: 1.55; }
    label { display: block; font-weight: 700; margin: 18px 0 8px; }
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #dce5df;
      border-radius: 12px;
      background: #fff;
      font: inherit;
      color: #17221e;
    }
    .status {
      margin: 20px 0;
      padding: 16px;
      border-radius: 14px;
      background: #f0f6f2;
      border: 1px solid #dce9df;
    }
    .status strong { display: block; font-size: 18px; margin-bottom: 6px; }
    .status span { font-size: 14px; color: #607169; line-height: 1.5; }
    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px 18px;
      background: #176448;
      color: #fff;
      font-weight: 750;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .small { font-size: 12px; color: #7a8981; margin-top: 18px; }
    .error { background: #fff3f1; border-color: #f2d4ce; }
    .success { background: #effaf2; border-color: #cbe8d2; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Study Hub</div>
    <h1>NFC Attendance</h1>
    <p>Your card has opened the attendance page. Select the front desk personnel, then press the button once to record your visit.</p>

    <label for="staffName">Front Desk Personnel</label>
    <select id="staffName" required>
      <option value="">Select personnel</option>
      <option value="Front Desk1">Front Desk1</option>
      <option value="Front Desk2">Front Desk2</option>
      <option value="Front Desk3">Front Desk3</option>
      <option value="Front Desk4">Front Desk4</option>
      <option value="Front Desk5">Front Desk5</option>
    </select>

    <div id="status" class="status" role="status" aria-live="polite">
      <strong>Checking card…</strong>
      <span>Please wait.</span>
    </div>

    <button id="tapBtn" disabled>Record attendance</button>
    <p class="small">If this is not your card, close this page. If you tap accidentally, please tell the staff.</p>
  </main>

<script>
const statusBox = document.getElementById('status');
const button = document.getElementById('tapBtn');
const staffSelect = document.getElementById('staffName');
const token = new URLSearchParams(location.search).get('token');

function show(title, message, type = '') {
  statusBox.className = 'status ' + type;
  statusBox.replaceChildren();

  const strong = document.createElement('strong');
  strong.textContent = title;

  const span = document.createElement('span');
  span.textContent = message;

  statusBox.append(strong, span);
}

if (!token || !token.trim()) {
  show(
    'Card token missing',
    'Please tap your registered NFC card or ask staff for help.',
    'error'
  );
} else {
  show('Card detected', 'Select personnel and press the button to record attendance.');
  button.disabled = false;
}

button.addEventListener('click', async () => {
  if (!token) return;

  const staffName = staffSelect.value;

  if (!staffName) {
    show('Select personnel', 'Please select the front desk personnel first.', 'error');
    return;
  }

  button.disabled = true;
  staffSelect.disabled = true;
  button.textContent = 'Recording…';
  show('Submitting attendance', 'Please keep this page open.');

  try {
    const res = await fetch('/api/attendance', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        token: token.trim(),
        staffName: staffName
      })
    });

    const data = await res.json();

    if (!res.ok || data.success !== true) {
      throw new Error(data.message || 'Unable to record attendance.');
    }

    if (data.action === 'TIME_IN') {
      show(
        'Time-in recorded',
        `${data.studentName || 'Student'} · ${data.timeIn || ''}. Please ask staff to select the session category in the Sessions sheet before time-out.`,
        'success'
      );
    } else if (data.action === 'TIME_OUT') {
      show(
        'Time-out recorded',
        `${data.studentName || 'Student'} · ${data.category || 'Session'} · ${data.billableHours ?? ''} billable hour(s) · Charge: ₱${Number(data.totalCharge || 0).toFixed(2)}`,
        'success'
      );
    } else {
      show('Attendance recorded', data.message || 'Your attendance was recorded.', 'success');
    }

    button.textContent = 'Attendance recorded';
  } catch (err) {
    show(
      'Could not record attendance',
      (err.message || 'An unexpected error occurred.') + ' Please ask staff for help.',
      'error'
    );
    button.disabled = false;
    staffSelect.disabled = false;
    button.textContent = 'Try again';
  }
});
</script>
</body>
</html>
